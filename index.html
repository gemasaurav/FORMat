<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>FORMat Lite</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<header>

<h1>📋 FORMat Lite</h1>

<p>
Paragraph → Personal Details Converter
</p>

</header>

<div class="card">

<h2>Input</h2>

<textarea

id="inputText"

placeholder="Paste any paragraph here...">

</textarea>

<div class="buttonRow">

<button id="extractBtn">

🔍 Extract

</button>

<button id="clearBtn">

🗑 Clear

</button>

</div>

<div id="loading"></div>

</div>

<div class="card">

<h2>Personal Details</h2>

<div class="photoArea">

<img

id="profilePhoto"

src="assets/profile.png"

alt="Profile">

</div>

<div class="formGrid">

<div class="field">

<label>Full Name</label>

<input

type="text"

id="name">

</div>

<div class="field">

<label>Father's Name</label>

<input

type="text"

id="father">

</div>

<div class="field">

<label>Age</label>

<input

type="text"

id="age">

</div>

<div class="field">

<label>Date of Birth</label>

<input

type="text"

id="dob">

</div>

<div class="field">

<label>Gender</label>

<input

type="text"

id="gender">

</div>

<div class="field">

<label>Mobile Number</label>

<input

type="text"

id="mobile">

</div>
