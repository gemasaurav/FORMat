<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>

FORMat Lite

</title>

<link
rel="stylesheet"
href="style.css">

</head>

<body>

<div class="container">

<header>

<h1>

📋 FORMat Lite

</h1>

<p>

Paragraph to Form Converter

</p>

</header>

<section class="inputSection">

<h2>

Paste Paragraph

</h2>

<textarea

id="inputText"

placeholder="Paste any paragraph here..."

></textarea>

<div class="buttons">

<button id="extractBtn">

🔍 Extract

</button>

<button id="clearBtn">

🗑 Clear

</button>

</div>

<div id="loading">

</div>

</section>

<section class="resultSection">

<h2>

Personal Details

</h2>

<div class="photoBox">

<img

src="assets/profile.png"

id="photo"

>

</div>

<div class="grid">

<label>

Full Name

</label>

<input
id="name"
type="text">

<label>

Father Name

</label>

<input
id="father"
type="text">

<label>

Age

</label>

<input
id="age"
type="text">

<label>

Date of Birth

</label>

<input
id="dob"
type="text">

<label>

Gender

</label>

<input
id="gender"
type="text">

<label>

Mobile Number

</label>

<input
id="mobile"
type="text">
<label>

Email ID

</label>

<input
id="email"
type="text">

<label>

Blood Group

</label>

<input
id="blood"
type="text">

<label>

Nationality

</label>

<input
id="nationality"
type="text">

<label>

Marital Status

</label>

<input
id="marital"
type="text">

<label>

Occupation

</label>

<input
id="occupation"
type="text">

<label>

Complete Address

</label>

<textarea
id="address"
rows="4"></textarea>

</div>

<div class="buttons bottomButtons">

<button id="copyBtn">

📋 Copy

</button>

<button id="pdfBtn">

📄 Save PDF

</button>

</div>

</section>

</div>
<script src="app.js"></script>

<script src="pdf.js"></script>

</body>

</html>
